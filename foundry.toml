[profile.default]
src = 'src'
out = 'out'
libs = ['lib']

solc_version = "0.8.28"
evm_version = "cancun"

optimizer = true
optimizer_runs = 1
verbosity = 3

ffi = true
fs_permissions = [
  # env/ is read-only on purpose: the one thing that writes a network config is a jq merge behind ffi, so a
  # test or a stray script cannot rewrite one through a cheatcode
  { access = "read", path = "env" },
  # The chain fixtures script/anvil/anvil.sh copies into env/anvil/ for a run, and the only configs this
  # branch checks in: a reader has to reach them before a run has happened
  { access = "read", path = "script/anvil/env" },
  { access = "read-write", path = "snapshots" },
  { access = "read-write", path = "spell-cache" },
  { access = "read", path = "out-ir" },
]

# {@see {@link https://github.com/foundry-rs/foundry/issues/4060} }
auto_detect_remappings = false

# Whether to store the referenced sources in the metadata as literal data. Helps with verification
use_literal_content = true

# The metadata hash is machine dependent. By default, this is set to none to allow for deterministic code.
# {@see {@link https://docs.soliditylang.org/en/latest/metadata.html} }
bytecode_hash = "none"
cbor_metadata = false

# Deployment specific settings
gas_reports = ["*"]
gas_reports_ignore = ["test/*", "script/*"]
gas_snapshot_check = false

# False-alarm warnings
ignored_warnings_from = [
  "src/misc/ReentrancyProtection.sol", # Issue: https://github.com/ethereum/solidity/issues/14359
]

dynamic_test_linking = false # crytic-compile can't resolve foundry-pp/DeployHelper*.sol virtual stubs

[profile.default.lint]
severity = ["high"]
exclude_lints = ["erc20-unchecked-transfer", "incorrect-shift"]

[profile.default.fuzz]
runs = 100
max_test_rejects = 1_000_000 # Number of times `vm.assume` can fail

[profile.default.invariant]
runs = 10
depth = 100
call_override = false
fail_on_revert = false

# Every network reachable by `--rpc-url <alias>` on the CLI and `vm.rpcUrl(<alias>)` in Solidity, so that
# building a URL out of a base and an API key happens in exactly one place. Aliases match the network names
# under env/<environment>/, which is how NetworkConfigLib.rpcUrl (a live-branch consumer) resolves one from
# a loaded config. Interpolation is lazy: a missing API key only fails the run that reaches for it.
[rpc_endpoints]
# Mainnets
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
avalanche = "https://avax-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
bnb-smart-chain = "https://bnb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
ethereum = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
hyper-evm = "https://hyperliquid-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
monad = "https://monad-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimism = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
pharos = "https://api.zan.top/node/v1/pharos/mainnet/${PHAROS_API_KEY}"
plume = "https://rpc.plume.org/${PLUME_API_KEY}"
x-layer = "https://rpc.xlayer.tech"
# Testnets
arbitrum-sepolia = "https://arb-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
base-sepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
hyper-evm-testnet = "https://hyperliquid-testnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
# Local chains brought up by script/anvil/anvil.sh, one per chain
local-a = "http://localhost:8545"
local-b = "http://localhost:8546"

# What `--verify` needs, per chain, so a deployment run carries no verification flags. Etherscan's v2 API
# takes one key for every chain it covers; the chains it does not are on Blockscout-compatible explorers,
# reached through an explicit url. Entries are matched by chain id, names mirror [rpc_endpoints].
[etherscan]
# Mainnets
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
avalanche = { key = "${ETHERSCAN_API_KEY}", chain = 43114 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
bnb-smart-chain = { key = "${ETHERSCAN_API_KEY}", chain = 56 }
ethereum = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
hyper-evm = { key = "${ETHERSCAN_API_KEY}", chain = 999 }
monad = { key = "${ETHERSCAN_API_KEY}", chain = 143, url = "https://api.socialscan.io/monad-mainnet/v1/explorer/command_api/contract" }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }
pharos = { key = "${ETHERSCAN_API_KEY}", chain = 1672, url = "https://api.socialscan.io/pharos-mainnet/v1/explorer/command_api/contract" }
plume = { key = "${ETHERSCAN_API_KEY}", chain = 98866, url = "https://explorer.plume.org/api/" }
# Testnets
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
base-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
hyper-evm-testnet = { key = "${ETHERSCAN_API_KEY}", chain = 998 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }

[profile.echidna]
dynamic_test_linking = false # Enabling this would lead to foundry-pp/DeployHelper*.sol files that crytic-compile can't resolve
# Override bytecode_hash for fuzzer coverage: "none" causes crytic-compile to treat every
# sequence as new coverage (metadata hash instability), leading to unbounded corpus growth and OOM.
# Production builds (default profile) keep "none" for deterministic bytecode.
bytecode_hash = "ipfs"
cbor_metadata = true

[profile.medusa]
dynamic_test_linking = false
bytecode_hash = "ipfs"
cbor_metadata = true

# Compile weiroll VM with via_ir (stack-depth workaround)
[profile.ir]
src = "src-ir"
test = "test-ir"
script = "script-ir"
libs = ["lib"]
out = "out-ir"
via_ir = true
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"
cbor_metadata = false
auto_detect_remappings = false

[profile.ci.fuzz]
runs = 1000
max_test_rejects = 1_000_000 # Number of times `vm.assume` can fail

[profile.ci.invariant]
runs = 100
depth = 1000
call_override = false
fail_on_revert = false

[profile.ci-coverage]
verbosity = 2
no_match_coverage = "test/spoke/fuzzing/**/*.sol"

[profile.ci-coverage.fuzz]
runs = 512                # 2x of default
max_test_rejects = 65_536 # default value

[profile.smt.model_checker]
engine = "chc" # constrained Horn clauses
invariants = ["contract", "reentrancy"]
show_unproved = true
timeout = 100_000 # in milliseconds, per solving query
targets = [
  "assert",
  "constantCondition",
  "divByZero",
  "outOfBounds",
  "overflow",
  "underflow",
]

[profile.smt.model_checker.contracts]
  "src/vaults/AsyncVault.sol" = ["AsyncVault"]
  "src/vaults/AsyncRequestManager.sol" = ["AsyncRequestManager"]
  "src/vaults/SyncManager.sol" = ["SyncManager"]
  "src/spoke/Spoke.sol" = ["Spoke"]
  "src/spoke/Escrow.sol" = ["Escrow"]
  "src/spoke/Root.sol" = ["Root"]
  "src/spoke/ERC20.sol" = ["ERC20"]
  "src/spoke/ShareToken.sol" = ["ShareToken"]
  "src/spoke/FullRestrictions.sol" = ["FullRestrictions"]
  "src/spoke/admin/Guardian.sol" = ["Guardian"]

[doc]
ignore = ["**/*.t.sol", "**/*.s.sol"]
out = "docs"
repository = "https://github.com/centrifuge/asset-pools"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
wrap_comments = false
ignore = [
  "test/*.sol"
]
