  <text x="370" y="595" font-size="17" fill="#3d4753" text-anchor="middle">deposit(poolId, scId, USDC, 0, 1000)</text>
  <text x="750" y="653" font-size="17" fill="#3d4753" text-anchor="middle">deposit(scId, USDC, 0, 1000)</text>
  <text x="1026" y="721" font-size="17" fill="#3d4753" text-anchor="start">holding.total: 2000 → 3000 USDC</text>
  <text x="960" y="773" font-size="17" fill="#3d4753" text-anchor="middle">queueAssets(poolId, scId, assetId, 1000, isIncrease: true)</text>
  <text x="1446" y="841" font-size="17" fill="#3d4753" text-anchor="start">queuedAssets.deposits: 500 → 1500 USDC</text>
  <text x="750" y="893" font-size="17" fill="#3d4753" text-anchor="middle">safeTransferFrom(caller → escrow,</text>
  <text x="750" y="915" font-size="17" fill="#3d4753" text-anchor="middle">1000 USDC)</text>
  <text x="370" y="1139" font-size="17" fill="#3d4753" text-anchor="middle">withdraw(poolId, scId, USDC, 0,</text>
  <text x="370" y="1161" font-size="17" fill="#3d4753" text-anchor="middle">receiver, 800)</text>
  <text x="750" y="1219" font-size="17" fill="#3d4753" text-anchor="middle">withdraw(scId, USDC, 0, receiver, 800)</text>
  <text x="1026" y="1287" font-size="17" fill="#3d4753" text-anchor="start">holding.total: 3000 → 2200 USDC</text>
  <text x="960" y="1339" font-size="17" fill="#3d4753" text-anchor="middle">queueAssets(poolId, scId, assetId, 800, isIncrease: false)</text>
  <text x="1446" y="1407" font-size="17" fill="#3d4753" text-anchor="start">queuedAssets.withdrawals: 200 → 1000 USDC</text>
  <text x="750" y="1459" font-size="17" fill="#3d4753" text-anchor="middle">authTransferTo(USDC, 0, receiver, 800)</text>
  <text x="370" y="1683" font-size="17" fill="#3d4753" text-anchor="middle">submitQueuedAssets(poolId, scId, assetId,</text>
  <text x="370" y="1705" font-size="17" fill="#3d4753" text-anchor="middle">extraGasLimit, refund)</text>
  <text x="960" y="1763" font-size="17" fill="#3d4753" text-anchor="middle">flushAssets(poolId, scId, assetId)</text>
  <text x="1446" y="1825" font-size="17" fill="#3d4753" text-anchor="start">net = deposits − withdrawals = 500 USDC;</text>
  <text x="1446" y="1847" font-size="17" fill="#3d4753" text-anchor="start">clear both to 0, queuedShares.nonce: 0 → 1</text>
  <text x="960" y="1893" font-size="17" fill="#3d4753" text-anchor="middle">UpdateData(netAmount: 500, isIncrease: true,</text>
  <text x="960" y="1915" font-size="17" fill="#3d4753" text-anchor="middle">isSnapshot: true, nonce: 0)</text>
  <text x="1210" y="2033" font-size="17" fill="#3d4753" text-anchor="middle">sendUpdateAssets(poolId, scId, assetId, data, extraGasLimit, refund)</text>
  <text x="2070" y="2091" font-size="17" fill="#3d4753" text-anchor="middle">increase(poolId, scId, assetId,</text>
  <text x="2070" y="2113" font-size="17" fill="#3d4753" text-anchor="middle">centrifugeId, 500)</text>
  <text x="2070" y="2171" font-size="17" fill="#3d4753" text-anchor="middle">value = delta priced at</text>
  <text x="2070" y="2193" font-size="17" fill="#3d4753" text-anchor="middle">the hub valuation</text>
  <text x="1946" y="2255" font-size="17" fill="#3d4753" text-anchor="start">hub.updateAccountingAmount(</text>
  <text x="1946" y="2277" font-size="17" fill="#3d4753" text-anchor="start">poolId, scId, assetId,</text>
  <text x="1946" y="2299" font-size="17" fill="#3d4753" text-anchor="start">isPositive: true, value)</text>
  <text x="2070" y="2345" font-size="17" fill="#3d4753" text-anchor="middle">setSnapshot(poolId, scId, centrifugeId,</text>
  <text x="2070" y="2367" font-size="17" fill="#3d4753" text-anchor="middle">isSnapshot: true, nonce: 0)</text>
  <text x="2266" y="2429" font-size="17" fill="#3d4753" text-anchor="end">snapshot.isSnapshot = true,</text>
  <text x="2266" y="2451" font-size="17" fill="#3d4753" text-anchor="end">snapshot.nonce: 0 → 1</text>
</svg>
