<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 830" width="1440" height="830" role="img" aria-labelledby="ttl dsc"><title id="ttl">The vault and what it talks to</title><desc id="dsc">On the spoke chain an investor calls the VaultRouter or the Vault; the Vault holds five plugin slots and uses the Spoke's escrow. The VaultRequestRouter carries requests to the hub chain, where the OrderBook holds one order per bucket and a manager fills it.</desc>
