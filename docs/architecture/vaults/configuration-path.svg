<text x="821.0" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#1f2a37" text-anchor="start">only the Envoy may call; the vault belongs to this pool</text>
<text x="60" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="normal" fill="#3d4753" text-anchor="start">The Envoy is the one msg.sender every target trusts, so the hub can be replaced without re-wiring policies, oracles or routes.</text>
