<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1090" width="1440" height="1090" role="img" aria-labelledby="ttl dsc"><title id="ttl">How the hub reaches the vault side</title><desc id="dsc">Two sequences. A pool manager configures a target through the hub, a message and the Envoy; and fills an order through the fee manager, hub and Envoy, after which the fill returns to the vault as a callback.</desc>
