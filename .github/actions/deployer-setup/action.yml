name: "Deployer setup"
description: >
  Everything a job needs before it can reach a network: GCP credentials, the gcloud CLI, Foundry, the
  deployer tools, the secrets in .env, and the forge dependencies. Requires a checkout, and `id-token: write`
  on the calling job for the workload identity federation to work.

  Used by every job that deploys, forks or verifies, so this file is where their Foundry pin and their
  credential setup live — one place to change rather than five that can disagree.

inputs:
  gcp-workload-identity-provider:
    description: "Workload identity provider to federate with (secrets.GCP_WIP)"
    required: true
  gcp-service-account:
    description: "Service account to impersonate (secrets.GCP_SA)"
    required: true
  foundry-version:
    description: >
      Foundry release to install. Pinned, because a floating version meters gas differently. This default is
      the version every network-touching job runs, and script/setup/setup.sh reads it from here so a local
      machine is held to the same one.
    required: false
    default: v1.4.4

runs:
  using: composite
  steps:
    - id: auth
      uses: "google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f" # v2.1.7
      with:
        workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
        service_account: ${{ inputs.gcp-service-account }}
        create_credentials_file: true
        cleanup_credentials: true

    - name: "Set up Cloud SDK"
      uses: "google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a" # v2.1.2
      with:
        version: ">= 363.0.0"

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: ${{ inputs.foundry-version }}

    - name: Setup deployer tools
      shell: bash
      env:
        CI_MODE: true
      run: ./script/setup/setup.sh

    # Also registers every secret with the runner, so they are starred out of the log from here on
    - name: Load secrets
      shell: bash
      run: ./script/setup/load-secrets.sh

    - name: Install dependencies (forge)
      shell: bash
      run: forge install -j 0 --shallow --color auto
