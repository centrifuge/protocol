name: security / review (spell)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/spell/**'
      - 'test/integration/spell/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write  # required by anthropics/claude-code-action@v1 (OIDC token fetch, even when using anthropic_api_key)

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spell-review:
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather PR diff + changed spells
        id: gather
        run: |
          mkdir -p out out/changed-spell-content
          git diff origin/${{ github.base_ref }}...HEAD > out/pr-diff.patch
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/spell/**' > out/changed-spells.txt
          if [ ! -s out/changed-spells.txt ]; then
            echo "No spell files changed — exiting early"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Skip if all spell changes are whitespace/formatting only (e.g., a forge fmt push).
          # `git diff -w` strips whitespace differences; empty output = no meaningful change.
          if [ -z "$(git diff -w origin/${{ github.base_ref }}...HEAD -- 'src/spell/**')" ]; then
            echo "Spell diff is whitespace/formatting only — skipping review"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          while read f; do
            [ -f "$f" ] && cp "$f" "out/changed-spell-content/$(basename "$f")"
          done < out/changed-spells.txt

      - name: Extract env address summary
        if: steps.gather.outputs.skip != 'true'
        run: |
          # Compress 14 × env/<chain>.json (~204KB total) into a single markdown
          # of `contract_name → address` per chain. Drops deploymentInfo, salts,
          # txHashes — Claude only needs name→address to cross-check spell
          # hardcoded constants against deployed addresses.
          echo "# env/ contract addresses (per chain)" > out/env-addresses.md
          echo "" >> out/env-addresses.md
          echo "Use this to verify hardcoded \`address constant\` values in the spell match" >> out/env-addresses.md
          echo "the actual deployed addresses for the chain they target." >> out/env-addresses.md
          for f in env/*.json; do
            [ -f "$f" ] || continue
            chain=$(basename "$f" .json)
            chainId=$(jq -r '.network.chainId // "?"' "$f")
            echo "" >> out/env-addresses.md
            echo "## $chain (chainId: $chainId)" >> out/env-addresses.md
            jq -r '.contracts // {} | to_entries[] | "- \(.key): \(.value.address // .value)"' "$f" >> out/env-addresses.md 2>/dev/null || true
          done
          SIZE=$(wc -c < out/env-addresses.md)
          echo "env-addresses.md size: $SIZE bytes"
          if [ "$SIZE" -gt 61440 ]; then
            echo "::warning::env-addresses.md is large ($SIZE bytes); consider per-chain filtering"
          fi

      - name: Stage reference spell (exemplar)
        if: steps.gather.outputs.skip != 'true'
        run: |
          # Canonical "small + correct" example. NOT 006_migration_v3.1 (one-off).
          cp env/spell/005_ethereum_0x1e860a8108c95be344f49ad1501fb281d8b6bfbb.sol \
             out/reference-spell.sol

      - name: Run Sonnet security review
        if: steps.gather.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Read,Glob,Grep,Write"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read `.github/prompts/spell-review.md` end-to-end and follow its
            instructions exactly. Context files for this PR:
              - out/pr-diff.patch                 (the unified diff vs base branch)
              - out/changed-spells.txt            (list of changed spell file paths)
              - out/changed-spell-content/*.sol   (full content of each changed spell)
              - out/env-addresses.md              (per-chain deployed addresses)
              - out/reference-spell.sol           (small correct exemplar)

            Write your final review to `out/security-review.md`. Do NOT post
            any PR comments yourself — a subsequent CI step does that.

      - name: Post or update PR comment
        if: steps.gather.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # Deterministic single-comment policy: lookup by marker, PATCH if found,
        # POST otherwise. Mirrors cfg/workflows/security-review.yml.
        run: |
          set -e
          if [ ! -f out/security-review.md ]; then
            echo "::warning::out/security-review.md not produced — skipping"
            exit 0
          fi
          MARKER='<!-- protocol-security-review -->'
          if ! head -1 out/security-review.md | grep -qF "$MARKER"; then
            echo "::error::security-review.md missing marker on line 1"
            exit 1
          fi
          BODY=$(cat out/security-review.md)
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            echo "Updating existing comment $COMMENT_ID"
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY" > /dev/null
          else
            echo "Creating new comment"
            gh api "repos/$REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
          fi

      - name: Cost telemetry
        if: always()
        run: |
          {
            echo "### Sonnet security-review cost"
            echo ""
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Run: ${{ github.run_id }}"
            echo "- See \`Run Sonnet security review\` step logs for token counts emitted by anthropics/claude-code-action@v1."
          } >> "$GITHUB_STEP_SUMMARY"
