# Deploy testnets — the trigger, and nothing else.
#
# The deployment lives on the live branch with the configs it deploys against: this file names no network,
# no flag and no toolchain version. It checks that branch out and asks it what to deploy:
#
#   .github/ci-scripts/deploy-testnet.sh plan        -> {"foundry": "<version>", "targets": [networks]}
#   .github/ci-scripts/deploy-testnet.sh run <net>   -> gated two-phase deploy, test data, verification
#
# The file sits on main because a workflow must exist on the default branch to be dispatchable at all.
# Manual only, deliberately: it broadcasts to real testnets with the shared deployer key.
#
# What a run deploys leaves as one `output-<network>` artifact per network (the network config and the
# broadcast receipts), uploaded success or failure — which is why the entrypoint must put nothing in
# $CI_OUTPUT_DIR it has not redacted: ::add-mask:: stars secrets out of the live log, never out of an
# uploaded file, and a failed run's receipts are the likeliest place for a keyed RPC URL. Uploaded anyway,
# because a run that stopped partway still wrote what it was
# going to deploy, and recovering by hand needs those addresses more than a clean run does. This workflow
# has no write access to the repository — whoever triggered the run downloads them and commits them, and
# until then the live branch still describes the deployment before this one.

name: Deploy testnets

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch holding the deployment (default: live-v3.3)"
        required: false
        default: "live-v3.3"
      deploymentId:
        description: "Isolates the deployment onto its own addresses (e.g. PR-123), 27 chars at most: the branch's ci-script deploys it as environment testnet-<id>, from env/testnet-<id>/ configs it derives from env/testnet/. Leave empty for the canonical addresses under env/testnet/."
        required: false
        type: string
        default: "TEST"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      foundry: ${{ steps.plan.outputs.foundry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Ask the branch what to deploy
        id: plan
        run: |
          plan=$(.github/ci-scripts/deploy-testnet.sh plan)
          jq . <<<"$plan"
          # The contract the comments state, enforced: ids become matrix values, job names, artifact names
          # and an inline-interpolated argument, so they stay within [A-Za-z0-9._-]; foundry is one token
          jq -e '(.foundry | test("^[A-Za-z0-9._-]+$")) and (.targets | length > 0 and all(test("^[A-Za-z0-9._-]+$")))' \
            <<<"$plan" >/dev/null || { echo "plan output violates the target-id contract" >&2; exit 1; }
          echo "targets=$(jq -c '.targets' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "foundry=$(jq -r '.foundry' <<<"$plan")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    name: ${{ matrix.target }}
    env:
      CI_OUTPUT_DIR: ${{ github.workspace }}/ci-outputs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ needs.plan.outputs.foundry }}

      - run: .github/ci-scripts/deploy-testnet.sh run "${{ matrix.target }}"
        env:
          DEPLOYMENT_ID_INPUT: ${{ inputs.deploymentId }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.target }}
          path: ci-outputs/
          if-no-files-found: warn
