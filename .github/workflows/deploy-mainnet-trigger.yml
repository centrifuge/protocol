# Deploy mainnet — the trigger, and nothing else. The deployment lives on the release's live branch
# (deploy-mainnet.yml there: the phases, the gate probing, the commit proposals to the ops Safe, the KMS
# executor, the record PR), pinned to the deployed version; this file sits on main because workflows are
# only dispatchable from the default branch, and it knows no chains — the branch's own `plan` derives the
# matrix from its env/mainnet/, narrowed to the networks the `chains` input names, if any.
#
# The `uses:` ref is the current release's branch, updated when a release is cut (see
# .claude/rules/deployment.md, "Cutting a release"): the workflow file always comes from that ref, while the
# `branch` input stays overridable so a run can still be dispatched against an older release — the called
# workflow checks out the input branch everywhere, but the job definitions are the ref's: the foundry pin
# and the shape of the `DeployAll.sh` calls come from there, so an older branch runs only while its scripts
# still match them.
#
# A mainnet campaign is dispatched twice — `phase: commit`, then `phase: deploy` — so no runner ever waits
# on a human: in between, the ops Safe's owners sign the commitments the commit phase proposed, and the
# namespace's delay on them runs out. `phase: verify` re-runs verification from a past run's receipts as
# often as needed. The called workflow documents each phase.
#
# `deploymentId` deploys an isolated mainnet-<id> onto its own addresses, from env/mainnet-<id>/: derived
# from the branch's env/mainnet/ without its contracts until a record PR checks it in. The registry publishes
# it only if the branch's env/registry.json points mainnet at it. Every phase of that campaign, and a resume
# or verify of it, is dispatched with the same id.

name: Deploy mainnet

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The release's live branch — its head is what deploys, and it receives the record PR"
        required: false
        default: "live-v3.3"
        type: string
      phase:
        description: "commit: probe, and propose the commitments that are missing to the ops Safe. deploy: deploy what the gate allows, refuse what it does not. verify: re-run verification from a past deploy run's receipts."
        required: true
        type: choice
        options:
          - commit
          - deploy
          - verify
      run_id:
        description: "verify, or deploy when resuming a stopped chain: the run whose artifacts hold the broadcast receipts"
        required: false
        type: string
      chains:
        description: "Comma-separated networks to run, named as their env/mainnet/<network>.json files; empty runs every mainnet chain. With run_id, the chains that run ran: a resume takes all of them, verify may name a subset"
        required: false
        type: string
      deploymentId:
        description: "Isolates the deployment onto its own addresses (e.g. rehearsal-1), 27 chars at most: the branch deploys it as environment mainnet-<id> from env/mainnet-<id>/ (derived from env/mainnet/ without its contracts until a record PR checks it in) and records it there. The registry publishes it only if env/registry.json points mainnet at it. Leave EMPTY for the canonical addresses. With run_id, the id that run deployed under"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    # One campaign at a time, held here: GitHub documents `concurrency` for the job that calls a reusable
    # workflow, and a top-level declaration inside the called one is not documented as honored
    concurrency:
      group: deploy-mainnet
      cancel-in-progress: false
    uses: centrifuge/protocol-internal/.github/workflows/deploy-mainnet.yml@live-v3.3
    # The ceiling the called workflow's jobs work under: a caller granting nothing would cap the record-PR
    # job's writes at the repository default
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
      checks: read
    with:
      branch: ${{ inputs.branch }}
      phase: ${{ inputs.phase }}
      run_id: ${{ inputs.run_id }}
      chains: ${{ inputs.chains }}
      deploymentId: ${{ inputs.deploymentId }}
    # `inherit` hands the called ref every repo secret, and the ref is a mutable branch: whoever can push
    # live-v3.3 can change what runs here. Kept because the called workflow declares SLACK_WEBHOOK_URL as
    # its one optional secret and the executor key never exists as a secret at all (KMS over workload
    # identity). Branch protection on live-* is the real boundary either way.
    secrets: inherit
