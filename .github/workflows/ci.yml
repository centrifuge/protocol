  #         architecture: x64

  #     - name: Install Foundry
  #       uses: foundry-rs/foundry-toolchain@v1
  #       with:
  #         version: nightly

  #     - name: Install `setuptools`
  #       run: pip install setuptools

  #     - name: Install Halmos
  #       run: pip install git+https://github.com/a16z/halmos.git@main

  #     - name: Show the Halmos version
  #       run: halmos --version

  #     - name: Run Halmos symbolic tests
  #       run: halmos --contract TestMessageLibIdentities --function test

  anvil-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/deployer-setup
        with:
          gcp-workload-identity-provider: ${{ secrets.GCP_WIP }}
          gcp-service-account: ${{ secrets.GCP_SA }}
      - name: Build ir profile
        run: FOUNDRY_PROFILE=ir forge build
      - name: Deploy Anvil
        run: |
          ./script/deploy/anvil.sh

  spelling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: ./docs
          ignore_words_list: embrio


  check-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Must stay pinned: GasService constants are gas-exact and regenerated locally via
          # `benchmarks.sh apply`. A floating version meters gas differently than contributors'
          # toolchain, making the check demand values nobody can reproduce.
          version: v1.4.4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Build ir profile
        run: FOUNDRY_PROFILE=ir forge build

      - name: Run benchmarks check
        run: ./script/checks/benchmarks.sh check
        env:
          FOUNDRY_PROFILE: ci

  claude-md-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Check CLAUDE.md directory tree
        run: python3 script/checks/check_claude_tree.py

  ward-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Check ward coverage
        run: python3 script/checks/check_ward_coverage.py

  foundry-networks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # foundry.toml's [rpc_endpoints] and [etherscan] are derived from env/*.json; this fails if they drifted
      - name: Check foundry.toml network tables
        run: python3 script/checks/check_foundry_networks.py
