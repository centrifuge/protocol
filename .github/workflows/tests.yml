name: "Tests"

on:
  # Not on PRs into the release branches: live only adds files on top of main, so everything here is already
  # green on main, and live-checks.yml covers the added surface there
  pull_request:
    branches-ignore:
      - "live-v*"
  push:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Only when the change can move a test result. The paths are what forge test compiles (src, src-ir through
      # out-ir, test, script), the files the tests read (the chain configs under env/ and their anvil fixtures, the
      # gas snapshots) and the toolchain, whose warnings --deny turns into failures. Gated per step rather than with
      # a paths filter, so the job still reports when it is a required check.
      # A base that is not in the history (a new branch, a force push) runs it
      - name: Check test inputs
        id: inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE...HEAD" -- \
            src src-ir 'test/*.sol' 'script/*.sol' script/anvil/env 'env/*.json' snapshots \
            lib foundry.toml foundry.lock remappings.txt .github/workflows/tests.yml)"
          echo "${CHANGED:-no test inputs changed}"
          echo "changed=$([ -n "$CHANGED" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install Foundry
        if: steps.inputs.outputs.changed == 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Build ir profile
        if: steps.inputs.outputs.changed == 'true'
        run: FOUNDRY_PROFILE=ir forge build

      - name: Run tests
        if: steps.inputs.outputs.changed == 'true'
        run: forge test --deny warnings --nmp "test/integration/{fork,spell}/**/*.sol"
        env:
          FOUNDRY_PROFILE: ci

  coverage:
    # Temporarily disabled: the runner has been flaking with mid-run shutdown/cancellation
    # unrelated to test correctness. Re-enable once that infra issue is resolved.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4

      - name: Build ir profile
        run: FOUNDRY_PROFILE=ir forge build

      - name: Run coverage
        run: forge coverage --report summary --report lcov --nmp "test/integration/{fork,spell}/**/*.sol"
        env:
          FOUNDRY_PROFILE: ci-coverage
          FORGE_SNAPSHOT_CHECK: false

      # To ignore coverage for certain directories modify the paths in this step as needed. The
      # below default ignores coverage results for the test and script directories. Alternatively,
      # to include coverage in all directories, comment out this step. Note that because this
      # filtering applies to the lcov file, the summary table generated in the previous step will
      # still include all files and directories.
      # The `--rc lcov_branch_coverage=1` part keeps branch info in the filtered report, since lcov
      # defaults to removing branch info.
      - name: Filter directories
        run: |
          sudo apt update && sudo apt install -y lcov
          lcov --remove lcov.info 'test/*' 'script/*' --output-file lcov.info --rc branch_coverage=1

      # This step posts a detailed coverage report as a comment and deletes previous comments on
      # each push. The below step is used to fail coverage if the specified coverage threshold is
      # not met. The below step can post a comment (when it's `github-token` is specified) but it's
      # not as useful, and this action cannot fail CI based on a minimum coverage threshold, which
      # is why we use both in this way.
      - name: Post coverage report
        if: github.event_name == 'pull_request' # This action fails when ran outside of a pull request.
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          delete-old-comments: true
          lcov-file: ./lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }} # Adds a coverage summary comment to the PR.

      - name: Verify minimum coverage
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v2
        with:
          coverage-files: ./lcov.info
          minimum-coverage: 0 # Set coverage threshold.
