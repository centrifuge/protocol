# Create public sync PRs — the trigger, and nothing else.
#
# The mirror lives on the live branch with the .publicignore it applies: the public repo shows the
# deployed protocol, and the rsync filter is read from the commit being synced, so the rules ride with
# the content they filter. This file checks that branch out (full history — the sync walks arbitrary
# merge commits) and runs its entrypoint:
#
#   .github/ci-scripts/sync-public.sh
#
# It sits on main because a workflow must exist on the default branch to be dispatchable at all.
# `contents: write` is for the public-sync-head tag the sync advances as it goes.

name: Create public sync PRs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch holding the mirror (default: live-v3.3)"
        required: false
        default: "live-v3.3"

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - run: .github/ci-scripts/sync-public.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
