testMode: "assertion"
prefix: "optimize_"
coverage: true
corpusDir: "echidna"
balanceAddr: 0x1043561a8829300000
balanceContract: 0x1043561a8829300000
## Entries MUST be contract-qualified. A bare "property_authorizationBypass()" is accepted by the config
## parser and then silently matches nothing, so the function keeps being called.
##
## Suppressed, NOT fixed: property_authorizationBypass is an acknowledged issue.
## Its handlers run `asAdmin` while _trackAuthorization
## records _getActor(), so a switch_actor followed by any manager-gated Spoke op flags a bypass that never
## happened. It fires in every campaign, eats the shrink budget, and echidna panics printing its trace
## before writing the coverage report. Remove this entry once the ghost tracks the effective caller.
filterFunctions: ["CryticE2ETester.property_authorizationBypass()"]
deployer: "0x7FA9385bE102ac3EAc297483Dd6233D62b3e1496"
contractAddr: "0x7FA9385bE102ac3EAc297483Dd6233D62b3e1496"
## ONLY USE LOCALLY: a finding used to stall the whole campaign for ~13 min of shrinking while
## fuzzing sat frozen. Raise it only when shrinking a specific reproducer to a minimal sequence.
# shrinkLimit: 5000
shrinkLimit: 100000
## Rely on Foundry compilation, compile and build libraries to those addresses
cryticArgs: ["--foundry-compile-all", "--compile-libraries=(MathLib,0xf01),(CastLib,0xf02),(BytesLib,0xf03),(MessageLib,0xf04),(TransientStorageLib,0xf05)"]
## Deploy them to these addresses
deployContracts: [
  ["0xf01", "MathLib"],
  ["0xf02", "CastLib"],
  ["0xf03", "BytesLib"],
  ["0xf04", "MessageLib"],
  ["0xf05", "TransientStorageLib"]
]
